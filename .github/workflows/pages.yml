name: Publish playtest Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-playtest-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout compiled mirror
        uses: actions/checkout@v4

      - name: Stage compiled site
        run: |
          test -f index.html
          mkdir -p site
          cp index.html site/index.html
          if [ -d assets ]; then cp -R assets site/assets; fi
          if [ -d audio ]; then cp -R audio site/audio; fi
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest site/manifest.webmanifest; fi
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
