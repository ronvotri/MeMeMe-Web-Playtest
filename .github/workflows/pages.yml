name: Publish playtest Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-playtest-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout compiled mirror
        uses: actions/checkout@v4

      - name: Stage and validate compiled site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -d assets

          rm -rf site
          mkdir -p site

          # Mirror every compiled root asset while keeping repo/workflow metadata out
          # of the Pages artifact. This prevents future public files from being
          # silently omitted when the Vite output grows.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'site' \
            -exec cp -a {} site/ \;

          touch site/.nojekyll

          js_asset="$(sed -n 's/.*src="\.\/\([^"]*\.js\)".*/\1/p' site/index.html | head -n1)"
          css_asset="$(sed -n 's/.*href="\.\/\([^"]*\.css\)".*/\1/p' site/index.html | head -n1)"
          test -n "$js_asset" && test -f "site/$js_asset"
          test -n "$css_asset" && test -f "site/$css_asset"
          test -f site/manifest.webmanifest
          test -f site/audio/bgm/01_Menu_MeMeMe.ogg
          test -f site/audio/sfx/dice.ogg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
