name: Browser viewport regression

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - assets/**
      - tests/browser-viewport.mjs
      - .github/workflows/browser-viewport.yml

permissions:
  contents: read

jobs:
  visual-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser regression dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static playtest site
        run: |
          python3 -m http.server 5173 --bind 127.0.0.1 >/tmp/mememe-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Check real DOM geometry in Chromium
        run: node tests/browser-viewport.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mememe-viewport-screenshots
          path: ui-viewport-evidence/
          if-no-files-found: ignore
          retention-days: 14
